$kind: http-request
url: "{{base_url}}/api/route/?start=Chicago, IL&finish=Los Angeles, CA"
method: GET
queryParams:
  start: Chicago, IL
  finish: Los Angeles, CA
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Cross-country route has multiple fuel stops', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.fuel_stops.length).to.be.above(0);
      });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{base_url}}/api/route/map/?start=Chicago, IL&finish=Los Angeles, CA"
method: GET
queryParams:
  start: Chicago, IL
  finish: Los Angeles, CA
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns HTML map page', function () {
          pm.response.to.have.header('Content-Type');
      });
    language: text/javascript
order: 6000

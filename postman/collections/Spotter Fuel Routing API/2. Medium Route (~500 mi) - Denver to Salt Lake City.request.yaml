$kind: http-request
url: "{{base_url}}/api/route/?start=Denver, CO&finish=Salt Lake City, UT"
method: GET
queryParams:
  start: Denver, CO
  finish: Salt Lake City, UT
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Response contains fuel_stops', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('fuel_stops');
          pm.expect(jsonData.fuel_stops).to.be.an('array');
      });
    language: text/javascript
order: 2000
